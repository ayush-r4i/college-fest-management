<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - College Fest Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width: 540px; padding-top: 5rem;">
    <div class="card error-card">
        <div class="error-code" th:text="${status}">500</div>
        <h1 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-primary);">Something went wrong</h1>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.25rem;">
            An unexpected error occurred while processing your request.<br>
            <span th:if="${error}" th:text="${error}" style="font-weight: 500; color: var(--text-secondary);"></span>
        </p>
        <div th:if="${message}" class="alert alert-error" style="text-align: left; margin-bottom: 1.5rem;">
            <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${message}">Error detail</span>
        </div>
        <a th:href="@{/dashboard}" class="btn" style="display: inline-flex; justify-content: center; width: auto; margin: 0 auto;">
            &larr; Back to Dashboard
        </a>
    </div>
</div>
</body>
</html>
