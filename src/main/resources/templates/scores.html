<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - College Fest Manager'">Scores</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-group">
            <h1>Evaluations & Scores</h1>
            <p class="page-subtitle">Detailed criteria evaluations submitted by panel judges</p>
        </div>
        <a th:href="@{/scores/new}" class="btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 11 12 14 22 4"></polyline>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            <span>Submit Score</span>
        </a>
    </div>

    <div class="alert alert-success" th:if="${success}">
        <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span th:text="${success}">Success message</span>
    </div>

    <div class="alert alert-error" th:if="${error}">
        <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span th:text="${error}">Error message</span>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
            <tr>
                <th>Team</th>
                <th>Judge</th>
                <th style="text-align: right;">Innovation</th>
                <th style="text-align: right;">Technical</th>
                <th style="text-align: right;">Presentation</th>
                <th style="text-align: right;">UI/UX</th>
                <th style="text-align: right;">Overall</th>
                <th style="text-align: right;">Final Score</th>
                <th style="width: 100px; text-align: right;">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(scores)}" class="empty-row">
                <td colspan="9">No scores submitted yet. Click "Submit Score" to record an evaluation.</td>
            </tr>
            <tr th:each="s : ${scores}">
                <td><strong th:text="${s.team != null ? s.team.teamName : ''}">Team</strong></td>
                <td th:text="${s.judge != null ? s.judge.name : ''}">Judge</td>
                <td style="text-align: right;" th:text="${s.innovation}">0</td>
                <td style="text-align: right;" th:text="${s.technicalImplementation}">0</td>
                <td style="text-align: right;" th:text="${s.presentation}">0</td>
                <td style="text-align: right;" th:text="${s.uiUx}">0</td>
                <td style="text-align: right;" th:text="${s.overallImpression}">0</td>
                <td style="text-align: right;" class="final-score" th:text="${s.finalScore}">0.0</td>
                <td style="text-align: right;">
                    <form th:action="@{/scores/{id}/delete(id=${s.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('Delete this score?');">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
