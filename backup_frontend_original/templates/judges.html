<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} + ' - College Fest Manager'">Judges</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Judges</h1>
        <a th:href="@{/judges/new}" class="btn">+ Add Judge</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Expertise</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(judges)}" class="empty-row">
            <td colspan="5">No judges added yet.</td>
        </tr>
        <tr th:each="j : ${judges}">
            <td th:text="${j.name}">Name</td>
            <td th:text="${j.email}">Email</td>
            <td th:text="${j.phone}">Phone</td>
            <td><span class="badge" th:text="${j.expertise}">Expertise</span></td>
            <td>
                <a th:href="@{/judges/{id}/edit(id=${j.id})}" class="btn btn-sm btn-secondary">Edit</a>
                <form th:action="@{/judges/{id}/delete(id=${j.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('Delete this judge? This will also remove their scores.');">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
