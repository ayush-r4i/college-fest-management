<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - College Fest Manager'">Team Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <div class="page-header" style="max-width: 600px; margin: 0 auto 1.5rem;">
        <div class="page-title-group">
            <h1 th:text="${pageTitle}">Register Team</h1>
            <p class="page-subtitle">Configure team details, event association, and leader contacts</p>
        </div>
        <a th:href="@{/teams}" class="btn btn-secondary btn-sm">&larr; Back to Teams</a>
    </div>

    <div class="card form-card">
        <div class="alert alert-error" th:if="${error}">
            <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${error}">An error occurred</span>
        </div>

        <form th:action="${team.id == null} ? @{/teams} : @{/teams/{id}(id=${team.id})}"
              th:object="${team}" method="post">

            <div class="form-group">
                <label for="eventId">Competition Event</label>
                <select id="eventId" name="eventId" th:disabled="${team.id != null}" required>
                    <option value="">Select an event</option>
                    <option th:each="ev : ${events}"
                            th:value="${ev.id}"
                            th:text="${ev.name} + ' (Max size: ' + ${ev.maxTeamSize} + ')'"
                            th:selected="${team.event != null and team.event.id == ev.id}"></option>
                </select>
                <div class="form-hint" th:if="${team.id != null}">
                    Event assignment is locked after team registration.
                </div>
            </div>

            <div class="form-group">
                <label for="teamName">Team Name</label>
                <input type="text" id="teamName" th:field="*{teamName}" required placeholder="e.g. Byte Busters">
                <div class="field-error" th:if="${#fields.hasErrors('teamName')}" th:errors="*{teamName}"></div>
            </div>

            <div class="form-group">
                <label for="leaderName">Team Leader Name</label>
                <input type="text" id="leaderName" th:field="*{leaderName}" required placeholder="e.g. Alex Johnson">
                <div class="field-error" th:if="${#fields.hasErrors('leaderName')}" th:errors="*{leaderName}"></div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="leaderEmail">Leader Email</label>
                    <input type="email" id="leaderEmail" th:field="*{leaderEmail}" placeholder="alex@example.com">
                </div>

                <div class="form-group">
                    <label for="leaderPhone">Leader Phone</label>
                    <input type="tel" id="leaderPhone" th:field="*{leaderPhone}" placeholder="+1 555-0100">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Save Team</button>
                <a th:href="@{/teams}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
