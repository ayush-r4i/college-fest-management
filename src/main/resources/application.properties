# ============================================
# Application
# ============================================
spring.application.name=college-fest-management
server.port=8080

# ============================================
# MySQL Database connection
# Update username/password to match your local MySQL setup.
# The database itself ("college_fest_db") must already exist -
# see the README for the CREATE DATABASE command.
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/college_fest_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=ayush
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# "update" will create/alter tables automatically based on the entities.
# schema.sql below also runs on startup for extra clarity/learning purposes.
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Let Hibernate create tables first, then run schema.sql after.
# (schema.sql uses "CREATE TABLE IF NOT EXISTS" and "INSERT IGNORE" so it is
# safe to run on every startup and never conflicts or duplicates rows.)
# NOTE: sample-data.sql (optional demo rows) is NOT auto-run - see README for
# how to load it manually, so restarting the app never duplicates demo data.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ============================================
# Thymeleaf
# ============================================
spring.thymeleaf.cache=false
