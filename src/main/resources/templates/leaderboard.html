<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} + ' - College Fest Manager'">Leaderboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta http-equiv="refresh" content="15">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>🏆 Live Leaderboard</h1>
    </div>
    <p style="color:#6b7280;font-size:0.85rem;margin-top:-0.5rem">
        This page auto-refreshes every 15 seconds so scores update live as judges submit them.
    </p>

    <table>
        <thead>
        <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Event</th>
            <th>Judges Scored</th>
            <th>Final Score</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(leaderboard)}" class="empty-row">
            <td colspan="5">No scores submitted yet. The leaderboard will populate as judges score teams.</td>
        </tr>
        <tr th:each="entry : ${leaderboard}" th:classappend="'rank-' + ${entry.rank}">
            <td><span class="rank-badge" th:text="${entry.rank}">1</span></td>
            <td th:text="${entry.teamName}">Team</td>
            <td th:text="${entry.eventName}">Event</td>
            <td th:text="${entry.numberOfJudgesScored}">0</td>
            <td class="final-score" th:text="${entry.averageScore}">0.0</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
