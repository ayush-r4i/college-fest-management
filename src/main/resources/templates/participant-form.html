<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - College Fest Manager'">Participant Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <div class="page-header" style="max-width: 600px; margin: 0 auto 1.5rem;">
        <div class="page-title-group">
            <h1 th:text="${pageTitle}">Add Participant</h1>
            <p class="page-subtitle">Enroll student participants and link them to registered teams</p>
        </div>
        <a th:href="@{/participants}" class="btn btn-secondary btn-sm">&larr; Back to Participants</a>
    </div>

    <div class="card form-card">
        <div class="alert alert-success" th:if="${success}">
            <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span th:text="${success}">Success message</span>
        </div>

        <div class="alert alert-error" th:if="${error}">
            <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${error}">An error occurred</span>
        </div>

        <form th:action="${participant.id == null} ? @{/participants} : @{/participants/{id}(id=${participant.id})}"
              th:object="${participant}" method="post">

            <div class="form-group" th:if="${participant.id == null}">
                <label for="teamId">Team Assignment</label>
                <select id="teamId" name="teamId" required>
                    <option value="">Select a team</option>
                    <option th:each="t : ${teams}"
                            th:value="${t.id}"
                            th:text="${t.teamName} + ' (' + (${t.event != null} ? ${t.event.name} : '') + ')'"
                            th:selected="${(selectedTeamId != null and selectedTeamId == t.id) or (participant.team != null and participant.team.id == t.id)}"></option>
                </select>
            </div>

            <div class="form-group" th:if="${participant.id != null}">
                <label>Assigned Team</label>
                <input type="text" th:value="${participant.team != null ? participant.team.teamName : ''}" disabled>
                <div class="form-hint">
                    To reassign this participant to a different team, remove and re-add them.
                </div>
            </div>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" th:field="*{name}" required placeholder="e.g. Maya Patel">
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="maya@university.edu">
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" th:field="*{phone}" placeholder="+1 555-0199">
                </div>
            </div>

            <div class="form-group">
                <label for="college">College / University</label>
                <input type="text" id="college" th:field="*{college}" placeholder="e.g. Institute of Technology">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Save Participant</button>
                <a th:href="@{/participants}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
