<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - College Fest Manager'">Teams</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-group">
            <h1>Teams</h1>
            <p class="page-subtitle">Registered competing teams, event assignments, and roster capacities</p>
        </div>
        <a th:href="@{/teams/new}" class="btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Register Team</span>
        </a>
    </div>

    <div class="alert alert-success" th:if="${success}">
        <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span th:text="${success}">Success message</span>
    </div>

    <div class="alert alert-error" th:if="${error}">
        <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span th:text="${error}">Error message</span>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
            <tr>
                <th>Team Name</th>
                <th>Assigned Event</th>
                <th>Team Leader</th>
                <th>Roster Status</th>
                <th style="width: 140px; text-align: right;">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(teams)}" class="empty-row">
                <td colspan="5">No teams registered yet. Click "Register Team" to add your first team.</td>
            </tr>
            <tr th:each="team : ${teams}">
                <td><strong th:text="${team.teamName}">Team Name</strong></td>
                <td><span class="badge" th:text="${team.event != null ? team.event.name : 'Unassigned'}">Event</span></td>
                <td th:text="${team.leaderName}">Leader Name</td>
                <td>
                    <span class="badge badge-secondary"
                          th:text="${#lists.size(team.participants)} + ' / ' + (${team.event != null} ? ${team.event.maxTeamSize} : '?') + ' members'">
                        0 / 4 members
                    </span>
                </td>
                <td style="text-align: right;">
                    <div class="actions-cell" style="justify-content: flex-end;">
                        <a th:href="@{/teams/{id}/edit(id=${team.id})}" class="btn btn-secondary btn-sm">Edit</a>
                        <form th:action="@{/teams/{id}/delete(id=${team.id})}" method="post" style="display:inline"
                              onsubmit="return confirm('Delete this team? This will also remove its participants and scores.');">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
