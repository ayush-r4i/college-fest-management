<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - College Fest Manager'">Judge Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <div class="page-header" style="max-width: 600px; margin: 0 auto 1.5rem;">
        <div class="page-title-group">
            <h1 th:text="${pageTitle}">Add Judge</h1>
            <p class="page-subtitle">Configure panel judge profile and technical evaluation domain</p>
        </div>
        <a th:href="@{/judges}" class="btn btn-secondary btn-sm">&larr; Back to Judges</a>
    </div>

    <div class="card form-card">
        <div class="alert alert-error" th:if="${error}">
            <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${error}">An error occurred</span>
        </div>

        <form th:action="${judge.id == null} ? @{/judges} : @{/judges/{id}(id=${judge.id})}"
              th:object="${judge}" method="post">

            <div class="form-group">
                <label for="name">Judge Full Name</label>
                <input type="text" id="name" th:field="*{name}" required placeholder="e.g. Dr. Anjali Deshmukh">
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" required placeholder="anjali@example.com">
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" th:field="*{phone}" placeholder="+1 555-0188">
                </div>
            </div>

            <div class="form-group">
                <label for="expertise">Domain Expertise</label>
                <input type="text" id="expertise" th:field="*{expertise}" placeholder="e.g. AI/ML, Cloud Architecture, UI/UX">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Save Judge</button>
                <a th:href="@{/judges}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
