<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} + ' - College Fest Manager'">Scores</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Scores</h1>
        <a th:href="@{/scores/new}" class="btn">+ Submit Score</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <table>
        <thead>
        <tr>
            <th>Team</th>
            <th>Judge</th>
            <th>Innovation</th>
            <th>Technical</th>
            <th>Presentation</th>
            <th>UI/UX</th>
            <th>Overall</th>
            <th>Final Score</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(scores)}" class="empty-row">
            <td colspan="9">No scores submitted yet.</td>
        </tr>
        <tr th:each="s : ${scores}">
            <td th:text="${s.team != null ? s.team.teamName : ''}">Team</td>
            <td th:text="${s.judge != null ? s.judge.name : ''}">Judge</td>
            <td th:text="${s.innovation}">0</td>
            <td th:text="${s.technicalImplementation}">0</td>
            <td th:text="${s.presentation}">0</td>
            <td th:text="${s.uiUx}">0</td>
            <td th:text="${s.overallImpression}">0</td>
            <td class="final-score" th:text="${s.finalScore}">0</td>
            <td>
                <form th:action="@{/scores/{id}/delete(id=${s.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('Delete this score?');">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
