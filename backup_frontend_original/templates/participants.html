<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} + ' - College Fest Manager'">Participants</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Participants</h1>
        <a th:href="@{/participants/new}" class="btn">+ Add Participant</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>College</th>
            <th>Team</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(participants)}" class="empty-row">
            <td colspan="6">No participants added yet.</td>
        </tr>
        <tr th:each="p : ${participants}">
            <td th:text="${p.name}">Name</td>
            <td th:text="${p.email}">Email</td>
            <td th:text="${p.phone}">Phone</td>
            <td th:text="${p.college}">College</td>
            <td th:text="${p.team != null ? p.team.teamName : ''}">Team</td>
            <td>
                <a th:href="@{/participants/{id}/edit(id=${p.id})}" class="btn btn-sm btn-secondary">Edit</a>
                <form th:action="@{/participants/{id}/delete(id=${p.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('Delete this participant?');">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
